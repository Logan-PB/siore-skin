<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시오레 피부상담 링크</title><meta name="description" content="시오레 맞춤 피부고민 진단과 제품 추천 상담"><meta property="og:title" content="시오레 피부상담 링크"><meta property="og:description" content="시오레 맞춤 피부고민 진단과 제품 추천 상담"><meta property="og:type" content="website"><meta property="og:url" content="https://logan-pb.github.io/siore-skin/"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="시오레 피부상담 링크"><meta name="twitter:description" content="시오레 맞춤 피부고민 진단과 제품 추천 상담"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}#canvas{position:absolute;top:0;left:0;border:0;transform-origin:top left;display:block}</style></head><body><iframe allow="fullscreen" id="canvas" title="시오레 피부상담" src="consultation-current.html?v=20261021-fit-v3&amp;motion=morph&amp;palette=glass"></iframe><script>
const frame=document.querySelector('iframe');const VIEW_KEY='siore-view-mode';let viewMode='auto';try{const q=new URLSearchParams(location.search).get('view');if(q){if(q==='auto')localStorage.removeItem(VIEW_KEY);else localStorage.setItem(VIEW_KEY,q);}viewMode=q||localStorage.getItem(VIEW_KEY)||'auto';}catch(e){viewMode=new URLSearchParams(location.search).get('view')||'auto';}
function resize(){const W=document.documentElement.clientWidth,H=window.visualViewport?Math.round(visualViewport.height):innerHeight;
/* view 모드: auto(자동) · portrait(세로 배치 고정) · rotate-right / rotate-left(화면이 옆으로 누워 보일 때 페이지를 90° 회전) */
const rot=viewMode==='rotate-right'?90:viewMode==='rotate-left'?-90:0;const w=rot?H:W,h=rot?W:H;
const portrait=rot!==0||viewMode==='portrait'||h>w;
/* 1024px 미만(폰·세로 태블릿)은 반응형 그대로, 큰 세로 화면(스탠바이미)은 한 줄 배치 확대, 가로 큰 화면은 1440 기준 확대 */
let layout;if(portrait&&w>=1060)layout=Math.min(640,Math.round(w/1.8));else if(portrait&&w>=900)layout=Math.min(820,Math.round(w/1.32));else if(viewMode==='portrait'&&w>=700)layout=Math.min(640,Math.round(w/Math.max(1,w/600)));else if(w<1024)layout=w;else if(w>=1600)layout=Math.round(w/Math.min(1.5,w/1440));else layout=Math.max(1280,w);
const scale=w/layout;frame.style.width=layout+'px';frame.style.height=Math.ceil(h/scale)+'px';frame.style.transformOrigin='0 0';
const sc=scale===1?'':' scale('+scale+')';frame.style.transform=rot===90?'translateX('+W+'px) rotate(90deg)'+sc:rot===-90?'translateY('+H+'px) rotate(-90deg)'+sc:(sc?sc.trim():'none');
document.documentElement.dataset.layout=rot?'rotated':(w<1024?(w<h?'portrait':'landscape'):(portrait?'big-portrait':'wide'));document.documentElement.dataset.view=viewMode;}
let raf;function queue(){cancelAnimationFrame(raf);raf=requestAnimationFrame(resize);}addEventListener('resize',queue);addEventListener('orientationchange',()=>setTimeout(resize,250));window.visualViewport&&visualViewport.addEventListener('resize',queue);resize();setInterval(()=>{try{const d=frame.contentDocument,inFlow=!!d.querySelector('#focus-dialog[open]'),btn=document.getElementById('siore-clinical-launch');if(btn)btn.style.display=(inFlow&&innerWidth<1024)||viewMode.startsWith('rotate')?'none':'';if(viewMode.startsWith('rotate')){const pop=document.getElementById('siore-clinical-popup');if(pop&&pop.open)pop.close();}}catch(e){}},700);
</script><script src="assets/clinical-popup/banner.js?v=8" defer></script></body></html>
