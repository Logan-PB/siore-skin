HELLO_TEST_123<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SIORÉ 방명록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --accent:#E1604C;
    --bg:#E8E8E7;
    --ink:#1C2B33;
    --sub:#6E6E6E;
    --border:#DAD7D2;
    --chip-bg:#FFFFFF;
    --field-bg:#FFF6F4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    overflow:hidden;
  }
  .screen{
    display:none;
    flex-direction:column;
    min-height:100vh;
    padding:40px 24px 32px;
  }
  .screen.active{display:flex;}

  /* ---------- Screen 1: Hook ---------- */
  #screen-main{align-items:center;justify-content:center;padding:40px 24px 28px;}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--accent);text-align:center;}
  .hook-title{margin-top:6px;font-size:34px;font-weight:800;color:var(--ink);text-align:center;}
  .hero-wrap{margin-top:18px;width:100%;border-radius:20px;overflow:hidden;box-shadow:0 18px 36px rgba(28,32,33,0.16);flex-shrink:0;}
  .hero-wrap img{width:100%;display:block;}
  .hook-copy{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;}
  .hook-sub{font-size:14px;color:var(--sub);line-height:1.6;text-align:center;}
  .reward-pill{padding:10px 18px;background:var(--accent);border-radius:999px;font-size:14.5px;font-weight:800;color:#fff;text-align:center;line-height:1.4;}
  .time-pill{padding:7px 15px;background:#FFFFFF;border:1px solid var(--border);border-radius:999px;font-size:12.5px;font-weight:700;color:#8A8478;}
  .cta-wrap{width:100%;margin-top:20px;}
  .cta-btn{width:100%;padding:18px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;}
  .cta-btn:active{opacity:.85;}
  .fine-print{margin-top:12px;font-size:11px;color:#A6A196;text-align:center;}

  /* ---------- Screen 2: Input ---------- */
  #screen-input{padding:28px 24px 100px;}
  .input-top{display:flex;align-items:center;gap:14px;}
  .back-btn{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;padding:0;}
  .progress-track{flex:1;display:flex;gap:6px;}
  .progress-seg{flex:1;height:4px;border-radius:2px;background:var(--border);}
  .progress-seg.done{background:var(--accent);}
  .input-title{margin-top:18px;font-size:21px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .field-list{margin-top:18px;display:flex;flex-direction:column;gap:14px;}
  .field-block label.field-label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .field-block .help-text{font-size:11.5px;color:#A6A196;margin-top:6px;}
  .text-input{width:100%;padding:14px 16px;background:var(--field-bg);border:1.4px solid #F0CFC6;border-radius:12px;font-size:15px;font-family:inherit;color:var(--ink);outline:none;}
  .text-input::placeholder{color:#C7BDB4;}
  .text-input:focus{border-color:var(--accent);}
  .phone-box{display:flex;align-items:center;width:100%;padding:14px 16px;background:var(--field-bg);border:1.4px solid #F0CFC6;border-radius:12px;}
  .phone-prefix{font-size:15px;font-weight:800;color:var(--ink);margin-right:2px;}
  .phone-input{flex:1;border:none;background:none;outline:none;font-size:15px;font-family:inherit;color:var(--ink);}
  .phone-input::placeholder{color:#C7BDB4;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:8px 14px;background:var(--chip-bg);border:1.3px solid var(--border);border-radius:999px;font-size:13px;font-weight:600;color:#5B5650;cursor:pointer;user-select:none;}
  .chip.selected{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .chip.other-chip{border-style:dashed;}
  .other-input-wrap{margin-top:8px;display:none;}
  .other-input-wrap.show{display:block;}
  .submit-wrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:14px 24px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top, var(--bg) 60%, rgba(232,232,231,0));}
  .submit-inner{width:100%;max-width:440px;}
  .submit-btn{width:100%;padding:17px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
  .submit-btn:disabled{opacity:.5;}
  .error-msg{font-size:12px;color:var(--accent);margin-top:4px;display:none;}
  .error-msg.show{display:block;}

  /* ---------- Screen 3: Confirm ---------- */
  #screen-confirm{align-items:center;justify-content:center;padding:40px;gap:20px;text-align:center;}
  .check-circle{width:84px;height:84px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .confirm-title{font-size:24px;font-weight:800;color:var(--ink);}
  .confirm-sub{font-size:15px;color:#5B6670;line-height:1.7;}
  .reward-card{width:100%;padding:16px;background:#FFFFFF;border:1.5px solid var(--accent);border-radius:14px;text-align:center;box-sizing:border-box;}
  .reward-card .r1{font-size:13px;font-weight:700;color:var(--accent);}
  .reward-card .r2{font-size:14px;font-weight:700;color:var(--ink);margin-top:4px;}
  .link-pill{padding:10px 18px;background:#FFFFFF;border:1.3px solid var(--border);border-radius:999px;font-size:13px;font-weight:700;color:var(--accent);text-align:center;text-decoration:none;display:inline-block;}
</style>
</head>

        <label class="field-label">가장 궁금한 라인은? (선택)</label>
        <div class="chip-row" id="interest-chips"></div>
      </div>

      <div class="error-msg" id="error-msg"></div>
    </div>

    <div class="submit-wrap">
      <div class="submit-inner">
        <button class="submit-btn" id="submit-btn" onclick="submitForm()">제출하기</button>
      </div>
    </div>
  </div>

  <!-- Screen 3: Confirm -->
  <div class="screen" id="screen-confirm">
    <div class="check-circle">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <div class="confirm-title">접수 완료!</div>
    <div class="confirm-sub">시오레 담당자가<br>곧 연락드릴게요</div>
    <div class="reward-card">
      <div class="r1">🎁 신규 거래 시작 시</div>
      <div class="r2">이너뷰티 10박스 지원</div>
    </div>
    <a class="link-pill" href="https://logan-pb.github.io/siore-skin/guides/siore_guide_12.html" target="_blank" rel="noopener">🔗 시오레 거래안내 링크접속</a>
  </div>

</div>

<script>
  // ---- config ----
  var FORM_ACTION = "https://docs.google.com/forms/u/0/d/e/1FAIpQLSemoGhPIdVy_ESJhe6U6kjGstQlVW5AbukvnIqu-Axxoopk_w/formResponse";
  var ENTRY = {
    name: "entry.926423194",
    pharmacy: "entry.1087217975",
    region: "entry.83872722",
    regionOther: "entry.83872722.other_option_response",
    phone: "entry.45420651",
    interest: "entry.806680020"
  };
  var REGIONS = ["강남구","서초구","송파구","강동구","마포구","영등포구","용산구","성동구","광진구","동작구","관악구","서대문구","종로구","중구","은평구","노원구","양천구","구로구"];
  var INTERESTS = ["NMN 라인","데일리 릴리프","PDRN200 이너뷰티","전체 라인업"];

  var selectedRegion = null;
  var selectedInterests = [];

  function goTo(id){
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    window.scrollTo(0,0);
  }

  function renderChips(){
    var regionWrap = document.getElementById('region-chips');
    REGIONS.forEach(function(r){
      var el = document.createElement('div');
      el.className = 'chip';
      el.textContent = r;
      el.onclick = function(){ selectRegion(r, el); };
      regionWrap.appendChild(el);
    });
    var otherEl = document.createElement('div');
    otherEl.className = 'chip other-chip';
    otherEl.textContent = '+ 기타(직접입력)';
    otherEl.onclick = function(){ selectRegion('기타', otherEl); };
    regionWrap.appendChild(otherEl);

    var interestWrap = document.getElementById('interest-chips');
    INTERESTS.forEach(function(i){
      var el = document.createElement('div');
      el.className = 'chip';
      el.textContent = i;
      el.onclick = function(){ toggleInterest(i, el); };
      interestWrap.appendChild(el);
    });
  }

  function selectRegion(r, el){
    document.querySelectorAll('#region-chips .chip').forEach(function(c){ c.classList.remove('selected'); });
    el.classList.add('selected');
    selectedRegion = r;
    var otherWrap = document.getElementById('other-wrap');
    if(r === '기타'){
      otherWrap.classList.add('show');
    } else {
      otherWrap.classList.remove('show');
    }
  }

  function toggleInterest(i, el){
    var idx = selectedInterests.indexOf(i);
    if(idx > -1){
      selectedInterests.splice(idx,1);
      el.classList.remove('selected');
    } else {
      selectedInterests.push(i);
      el.classList.add('selected');
    }
  }

  function showError(msg){
    var e = document.getElementById('error-msg');
    e.textContent = msg;
    e.classList.add('show');
  }
  function clearError(){
    var e = document.getElementById('error-msg');
    e.classList.remove('show');
    e.textContent = '';
  }

  function submitForm(){
    clearError();
    var name = document.getElementById('f-name').value.trim();
    var pharmacy = document.getElementById('f-pharmacy').value.trim();
    var phoneDigits = document.getElementById('f-phone').value.replace(/[^0-9]/g,'');
    var regionOther = document.getElementById('f-region-other').value.trim();

    if(!name){ showError('약사님 성함을 입력해주세요'); return; }
    if(!pharmacy){ showError('약국명을 입력해주세요'); return; }
    if(!selectedRegion){ showError('지역(시/구)을 선택해주세요'); return; }
    if(selectedRegion === '기타' && !regionOther){ showError('지역을 간단히 적어주세요'); return; }
    if(!/^[0-9]{7,8}$/.test(phoneDigits)){ showError('휴대폰번호 뒷자리를 정확히 입력해주세요'); return; }

    var fullPhone = '010' + phoneDigits;

    var btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '전송 중...';

    var fd = new FormData();
    fd.append(ENTRY.name, name);
    fd.append(ENTRY.pharmacy, pharmacy);
    fd.append(ENTRY.region, selectedRegion);
    if(selectedRegion === '기타'){
      fd.append(ENTRY.regionOther, regionOther);
    }
    fd.append(ENTRY.phone, fullPhone);
    selectedInterests.forEach(function(i){
      fd.append(ENTRY.interest, i);
    });

    fetch(FORM_ACTION, {
      method: 'POST',
      mode: 'no-cors',
      body: fd
    }).then(function(){
      goTo('screen-confirm');
    }).catch(function(){
      goTo('screen-confirm');
    });
  }

  renderChips();
</script>
</body>
</html>
