<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>시오레 승인 문자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:#FFF7F2;color:#1f1f1f;display:flex;justify-content:center;padding:24px 16px}
.c{max-width:420px;width:100%;background:#fff;border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(242,90,31,.12)}
h1{font-size:18px;margin:0 0 4px}.to{color:#C2410C;font-weight:700;margin:0 0 14px}
textarea{width:100%;box-sizing:border-box;min-height:300px;border:1px solid #f3d6c8;border-radius:12px;padding:12px;font:inherit;font-size:15px;line-height:1.55}
a.b,button{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}
a.b{background:#F25A1F;color:#fff}button{background:#FFF1EA;color:#C2410C}
p.n{font-size:13px;color:#777;margin:12px 0 0}
</style></head><body><div class="c">
<h1>📩 승인 안내 문자</h1><p class="to" id="to"></p>
<textarea id="t"></textarea>
<a class="b" id="go" href="#">문자 앱에서 보내기</a>
<button id="cp" type="button">문구 복사</button>
<p class="n">문구는 위에서 고친 뒤 보내도 돼요. 휴대폰에서 열어야 문자 앱이 바로 열려요.</p>
</div><script>
const q=new URLSearchParams(location.search);
const to=(q.get('to')||'').replace(/[^0-9]/g,'');
const ph=(q.get('ph')||'').slice(0,40), ow=(q.get('ow')||'').slice(0,20);
document.getElementById('to').textContent=(ph?ph+' '+ow+' 약사님 · ':'')+to.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3');
const t=document.getElementById('t');
t.value=`[시오레 SIORÉ] 🧡
${ph} ${ow} 약사님, 안녕하세요!
시오레와 함께해 주셔서 진심으로 감사드립니다 🙏

✅ B2B몰 등업이 완료되어 지금부터 주문하실 수 있어요.
🛒 주문: siorekorea.co.kr (가입하신 아이디로 로그인)

⚠️ 꼭 확인해 주세요!
이미 로그인되어 있다면 로그아웃 후 다시 로그인해 주셔야 약국 공급가가 적용됩니다.

📦 주문 안내
· 평일 12:30 이전 주문 건은 당일 집하가 시작돼요.
· 12:30 이후·주말·공휴일 주문은 다음 영업일에 출고돼요.

진열·POP·상담 자료가 필요하시면 언제든 편하게 연락 주세요 😊
담당 한창훈 010-3109-3106`;
const go=document.getElementById('go');
function upd(){go.href='sms:'+to+'?&body='+encodeURIComponent(t.value)}
t.addEventListener('input',upd);upd();
document.getElementById('cp').onclick=async()=>{try{await navigator.clipboard.writeText(t.value);cp.textContent='복사됐어요 ✓'}catch(e){t.select()}};
</script></body></html>
